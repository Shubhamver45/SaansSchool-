AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SaansSchool — Automated School Air Defense System (AWS Air Track Hackathon)
  Serverless pipeline integrating live CPCB CAAQMS sensor telemetry,
  NASA FIRMS VIIRS satellite thermal detections, and Open-Meteo wind vectors
  with Amazon EventBridge, AWS Lambda, Amazon DynamoDB, Amazon Bedrock, and Amazon SES.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.11
    Architectures:
      - x86_64
    Environment:
      Variables:
        STAGE: prod
        DYNAMODB_STATUS_TABLE: !Ref SaansSchoolStatusTable
        DYNAMODB_AUDIT_TABLE: !Ref SaansSchoolAuditTable
        S3_DATA_BUCKET: !Ref SaansSchoolDataBucket
        BEDROCK_REGION: !Sub "${AWS::Region}"

Resources:
  # -------------------------------------------------------------
  # 1. API GATEWAY & FASTAPI CORE MICROSERVICE
  # -------------------------------------------------------------
  SaansSchoolApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: saans-school-api
      CodeUri: .
      Handler: app.main.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SaansSchoolStatusTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SaansSchoolAuditTable
        - S3CrudPolicy:
            BucketName: !Ref SaansSchoolDataBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - ses:SendEmail
                - ses:SendRawEmail
                - sns:Publish
              Resource: "*"
      Events:
        ProxyApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: Api
          Properties:
            Path: /
            Method: ANY

  # -------------------------------------------------------------
  # 2. AUTOMATED 15-MIN EVENTBRIDGE SCHEDULED INGESTION LAMBDA
  # -------------------------------------------------------------
  SaansIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: saans-ingest-worker
      CodeUri: .
      Handler: app.services.schools_service.ingest_worker_handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SaansSchoolStatusTable
        - S3CrudPolicy:
            BucketName: !Ref SaansSchoolDataBucket
      Events:
        Every15Minutes:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Name: SaansSchoolIngestSchedule
            Description: Triggers CPCB ground stations and NASA FIRMS active fire fetch every 15 min.

  # -------------------------------------------------------------
  # 3. DYNAMODB PERSISTENCE LAYER (Zero-Cost Free Tier)
  # -------------------------------------------------------------
  SaansSchoolStatusTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SaansSchoolDailyStatus
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: school_id
          AttributeType: S
        - AttributeName: observation_date
          AttributeType: S
      KeySchema:
        - AttributeName: school_id
          KeyType: HASH
        - AttributeName: observation_date
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  SaansSchoolAuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SaansSchoolActionAudit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: school_id
          AttributeType: S
        - AttributeName: action_timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: school_id
          KeyType: HASH
        - AttributeName: action_timestamp
          KeyType: RANGE

  # -------------------------------------------------------------
  # 4. S3 TELEMETRY & GEOJSON ARTIFACT STORAGE
  # -------------------------------------------------------------
  SaansSchoolDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "saans-school-data-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  SaansSchoolApiUrl:
    Description: "API Gateway endpoint URL for SaansSchool"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  SaansSchoolApiFunctionArn:
    Description: "SaansSchool API Lambda Function ARN"
    Value: !GetAtt SaansSchoolApiFunction.Arn
  DynamoDBStatusTable:
    Description: "DynamoDB Status Cache Table"
    Value: !Ref SaansSchoolStatusTable
  DynamoDBAuditTable:
    Description: "DynamoDB Action Audit Table"
    Value: !Ref SaansSchoolAuditTable

